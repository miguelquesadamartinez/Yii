services:
  web:
    build: .
    container_name: yii_web
    ports:
      - "8082:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db
    networks:
      - yii_network
    environment:
      - APACHE_DOCUMENT_ROOT=/var/www/html

  db:
    image: mysql:5.7
    container_name: yii_db
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: yii_users
      MYSQL_USER: yii_user
      MYSQL_PASSWORD: yii_password
    volumes:
      - db_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - yii_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: yii_phpmyadmin
    ports:
      - "8083:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: root_password
      PMA_ARBITRARY: 1
      PMA_ABSOLUTE_URI: http://localhost:8083/
    depends_on:
      - db
    networks:
      - yii_network

volumes:
  db_data:

networks:
  yii_network:
    driver: bridge
